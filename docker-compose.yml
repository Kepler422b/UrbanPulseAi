version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - JWT_SECRET_KEY=urbanpulse-docker-secret-key-replace-in-production!
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGODB_DB_NAME=urbanpulse_ai
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  backend_uploads:
  mongo_data:
